name: Docker Image Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT: openreview
  ORG: stackmon

permissions:
  contents: read

jobs:

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          swr.eu-de.otc.t-systems.com/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=ref,event=pr

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: false

  # preprod is the only deployment environment; the stackmon organization
  # provides SWR_URL, SWR_USERNAME and SWR_PASSWORD as Actions variables.
  publish-preprod:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ vars.SWR_URL || 'swr.eu-de.otc.t-systems.com' }}/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Container Registry
      env:
        SWR_URL: ${{ vars.SWR_URL || 'swr.eu-de.otc.t-systems.com' }}
        SWR_USERNAME: ${{ vars.SWR_USERNAME }}
        SWR_PASSWORD: ${{ vars.SWR_PASSWORD }}
      run: |
        set -euo pipefail

        if [ -z "$SWR_USERNAME" ] || [ -z "$SWR_PASSWORD" ]; then
          echo "SWR_USERNAME and SWR_PASSWORD must be set as organization variables" >&2
          exit 1
        fi

        printf '%s' "$SWR_PASSWORD" | docker login "$SWR_URL" --username "$SWR_USERNAME" --password-stdin

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # SWR rejects the OCI image index and attestation manifests that BuildKit adds by default.
        provenance: false
        sbom: false
        push: true
